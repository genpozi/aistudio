<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Momentum Glass - A personal dashboard"
    />
    <title>Momentum Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react/": "https://esm.sh/react@18.2.0/",
    "react": "https://esm.sh/react@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai"
  }
}
</script>
<style>
  .transition-background-image {
    transition-property: background-image;
  }
  /* Custom scrollbar for Webkit browsers */
  .custom-scrollbar::-webkit-scrollbar {
    width: 8px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background-color: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background-color: rgba(255, 255, 255, 0.4);
  }
  /* Animation for new todo item */
  @keyframes fadeInAndScale {
    from {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  .animate-add-todo {
    animation: fadeInAndScale 0.3s ease-out forwards;
  }

  /* --- THEME DEFINITIONS --- */
  :root, .theme-chroma {
    --color-primary-rgb: 22, 163, 74; /* Green-600 as a fallback, will be customized by themes */
    --color-primary: rgb(var(--color-primary-rgb));
    --color-backdrop-start: rgba(255, 255, 255, 0.03);
    --color-backdrop-end: rgba(255, 255, 255, 0.05);
    --color-border-hover: rgba(22, 163, 175, 0.5);
    --color-glow: rgba(22, 163, 175, 0.25);
    --text-highlight: #16a3af; /* cyan-500 */
  }

  .theme-cyberwave {
    --color-primary-rgb: 192, 132, 252; /* purple-400 */
    --color-backdrop-start: rgba(192, 132, 252, 0.04);
    --color-backdrop-end: rgba(99, 102, 241, 0.06); /* indigo-500 */
    --color-border-hover: rgba(192, 132, 252, 0.5);
    --color-glow: rgba(124, 58, 237, 0.3); /* violet-600 */
    --text-highlight: #c084fc; /* purple-400 */
  }

  .theme-solstice {
    --color-primary-rgb: 251, 146, 60; /* orange-400 */
    --color-backdrop-start: rgba(251, 146, 60, 0.04);
    --color-backdrop-end: rgba(234, 179, 8, 0.06); /* yellow-500 */
    --color-border-hover: rgba(251, 146, 60, 0.6);
    --color-glow: rgba(249, 115, 22, 0.3); /* orange-500 */
    --text-highlight: #fb923c; /* orange-400 */
  }
</style>
<script>
  // Immediately set the theme on the <html> element to prevent FOUC
  (function() {
    try {
      const themeId = JSON.parse(localStorage.getItem('userTheme') || '"chroma"');
      const themeClassName = 'theme-' + themeId;
      document.documentElement.className = themeClassName;
    } catch (e) {
      document.documentElement.className = 'theme-chroma'; // Fallback
    }
  })();
</script>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
